{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} Product - StockFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-3">{{ 'Edit Product' if product else 'Add Product' }}</h3>
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Name *</label>
                            <input type="text" name="name" class="form-control"
                                   value="{{ form.get('name', '') }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">SKU *</label>
                            <input type="text" name="sku" class="form-control"
                                   value="{{ form.get('sku', '') }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" rows="2" class="form-control">{{ form.get('description', '') }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Quantity on hand *</label>
                            <input type="number" name="quantity_on_hand" class="form-control" min="0"
                                   value="{{ form.get('quantity_on_hand', '') }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Low stock threshold</label>
                            <input type="number" name="low_stock_threshold" class="form-control" min="0"
                                   value="{{ form.get('low_stock_threshold', '') }}"
                                   placeholder="Empty = organization default">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Cost price</label>
                            <input type="number" name="cost_price" class="form-control" min="0" step="0.01"
                                   value="{{ form.get('cost_price', '') }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Selling price</label>
                            <input type="number" name="selling_price" class="form-control" min="0" step="0.01"
                                   value="{{ form.get('selling_price', '') }}">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        {{ 'Save changes' if product else 'Create product' }}
                    </button>
                    <a href="{{ url_for('product_list') }}" class="btn btn-link">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
